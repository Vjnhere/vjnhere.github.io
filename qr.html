<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR code for my site</title>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 20px;color:#16202B}
input{width:100%;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:3px}
button{margin-top:12px;padding:10px 16px;font-size:15px;cursor:pointer}
#out{margin-top:24px}
canvas{border:1px solid #eee}
</style>
</head>
<body>
<h1>QR code</h1>
<p>Paste your live site link, press Make, then right-click / long-press the image to save it. Print it big — at least 5 cm across.</p>
<input id="url" value="https://USERNAME.github.io/REPO/">
<button id="go">Make QR</button>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script>
document.getElementById('go').onclick=()=>{
  const out=document.getElementById('out');
  out.innerHTML='<canvas id="c"></canvas>';
  new QRious({element:document.getElementById('c'),value:document.getElementById('url').value,size:600,level:'H',padding:20});
};
</script>
</body>
</html>
